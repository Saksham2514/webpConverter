name: Build macOS Executable

on:
  push:
    branches: [ main, master ]  # Runs every time you upload new code
  workflow_dispatch:          # Allows you to run this manually

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'  # Matches your local Python version

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pillow pygame pandas numpy

    - name: Build Mac Executable
      run: |
        pyinstaller --onefile --windowed webpConverter.py

    - name: Zip the Application
      run: |
        cd dist
        zip -r webpConverter-mac.zip webpConverter.app webpConverter

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: macos-executable
        path: dist/webpConverter-mac.zip
